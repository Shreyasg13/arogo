<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ service }} — MediScan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  body{font-family:'DM Sans',sans-serif;background:#F8F9FA;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;border-radius:20px;padding:48px;max-width:440px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.1)}
  .icon{font-size:52px;margin-bottom:16px}
  h1{font-family:'DM Serif Display',serif;font-size:24px;margin:0 0 8px;color:#111827}
  p{color:#6B7280;font-size:14px;line-height:1.6;margin:0 0 28px}
  .service{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#9CA3AF;margin-bottom:4px}
  a{display:inline-block;background:#0E6B5E;color:#fff;padding:11px 28px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500}
  a:hover{background:#0A4F46}
</style>
</head>
<body>
<div class="card">
  <div class="icon">{{ '✅' if success else '❌' }}</div>
  <div class="service">{{ service }}</div>
  <h1>{{ 'Connected!' if success else 'Connection Failed' }}</h1>
  <p>{{ message }}</p>
  <a href="/">Back to MediScan</a>
</div>
</body>
</html>
