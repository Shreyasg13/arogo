name: MedEasy API Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

# Cancel an in-progress run when a newer commit is pushed to the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q --tb=short -n auto --dist loadfile

      - name: JS syntax
        run: |
          node --check static/js/app.js
          node --check static/sw.js

      - name: JS unit tests
        run: node tests/js/run_js_tests.mjs

      # Advisory: surfaces new dependency CVEs without blocking the build
      # (upstream fixes aren't always available yet). Review its output.
      - name: Dependency audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
